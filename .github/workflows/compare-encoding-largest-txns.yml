---
name: compare-encoding-largest-txns

'on':
  pull_request:
    paths:
      - '**.rs'
      - '**.ts'
      - '**Cargo**'
      - '**package*.json'
      - '.github/workflows/compare-encoding-*.yml'
  schedule:
    - cron: '42 */12 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  ethers-encode:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present

      - name: DEBUG - Print runner IP address
        run: |
          # see https://opensource.com/article/18/5/how-find-ip-address-linux
          IP_ADDRESS=$(curl https://ifconfig.me)
          echo "INFO: IP_ADDRESS=$IP_ADDRESS"

      - name: Encode the 8 largest mainnet transactions
        timeout-minutes: 5
        run: |
          set -o pipefail
          node dist/bin/encode-largest-txns.js \
            wss://blockchain.googleapis.com/v1/projects/creditcoin-test/locations/us-central1/endpoints/ethereum-mainnet/rpc?key=*** secrets.GOOGLE_ETHEREUM_RPC_KEY }} \
            /var/tmp/encoded-data/ethers/ \
            2>&1 | tee /var/tmp/ethers-encode.log

      - name: Fail on encode errors or MAX_ENCODED_SIZE
        if: always()
        run: |
          if [ ! -f /var/tmp/ethers-encode.log ]; then
            echo "::error::encode log not found — cannot verify results"
            exit 1
          fi

          # The encoder never throws: it logs every failure so all 8 fixtures
          # get attempted in one run. Grep for both failure markers here and
          # fail the pipeline once, after everything has been attempted.
          FAILED=0
          if grep -q 'ENCODE_ERROR' /var/tmp/ethers-encode.log; then
            echo "::error::One or more largest txns failed to encode:"
            grep 'ENCODE_ERROR' /var/tmp/ethers-encode.log
            FAILED=1
          fi
          if grep -q 'MAX_ENCODED_SIZE' /var/tmp/ethers-encode.log; then
            echo "::error::One or more transactions exceeded MAX_ENCODED_SIZE:"
            grep 'MAX_ENCODED_SIZE' /var/tmp/ethers-encode.log
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "No encode errors detected."

      - name: Add notices in case of failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          # note: GitHub appears to display these in reverse order
          echo "::notice::SUGGESTION: Trigger this workflow manually against the same branch to verify the changes."
          echo "::notice::IMPORTANT:  Secret credentials may be missing for PRs from Dependabot!"

      - name: Report result to Slack
        if: failure() && github.event_name == 'schedule'
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          channel: '#protocol-internal'
          message: 'Ethers encode (largest txns) failed! cc <@U028EMRHS3S>'

      - name: Upload encoded data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: encoded-by-ethers-largest
          path: /var/tmp/encoded-data/ethers
          include-hidden-files: true

  decode-transactions:
    needs:
      - ethers-encode
    # Run even if ethers-encode "failed" (e.g. the encode-error/MAX_ENCODED_SIZE
    # guard tripped). decode-transactions only consumes the uploaded
    # encoded-by-ethers-largest artifact, which is uploaded with `if: always()`,
    # so it can still run and decode the transactions that were produced.
    # !cancelled() keeps manual/cancel behaviour intact.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present

      - name: Download encoded data from ethers
        uses: actions/download-artifact@v8
        with:
          path: /var/tmp/encoded-data
          pattern: encoded-by-ethers-largest

      - name: Decode transactions
        timeout-minutes: 5
        run: |
          node dist/bin/decode-blocks.js \
            wss://rpc.cc3-devnet.creditcoin.network \
            https://prover.cc3-devnet.creditcoin.network \
            0xf882f3a71A36E29E86615B7055f42A68D7E4cfBB \
            /var/tmp/encoded-data/ \
            4

      - name: Report result to Slack
        if: always()
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          channel: '#protocol-internal'
          message: 'Decoding (largest txns) complete! cc <@U028EMRHS3S>'
