name: linters

on:
  pull_request:
    branches:
      - 'main'

jobs:
  execute:
    name: check-format
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run check-format
        continue-on-error: true
